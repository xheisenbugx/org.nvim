<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="title">
  <title id="title">org.nvim</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#262063"/>
      <stop offset="1" stop-color="#0C0A22"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6D5CF6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6D5CF6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="spoke" gradientUnits="userSpaceOnUse" x1="0" y1="160" x2="0" y2="410">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D9D4FA"/>
    </linearGradient>
    <linearGradient id="horn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFF0C4"/>
      <stop offset="0.5" stop-color="#EDC46A"/>
      <stop offset="1" stop-color="#C08A2E"/>
    </linearGradient>
    <clipPath id="hornClip"><path id="hornShape" d="M256 72 L281 286 A25 25 0 0 1 231 286 Z"/></clipPath>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#tile)"/>
  <circle cx="256" cy="290" r="190" fill="url(#halo)"/>
  <rect x="1.5" y="1.5" width="509" height="509" rx="114.5" fill="none" stroke="url(#rim)" stroke-width="3"/>

  <!-- the headline star; its top spoke is the horn -->
  <g stroke="url(#spoke)" stroke-width="46" stroke-linecap="round" transform="translate(256 290)">
    <line x1="0" y1="0" x2="0" y2="112"/>
    <line x1="0" y1="0" x2="97" y2="56"/>
    <line x1="0" y1="0" x2="-97" y2="56"/>
    <line x1="0" y1="0" x2="97" y2="-56"/>
    <line x1="0" y1="0" x2="-97" y2="-56"/>
  </g>
  <use href="#hornShape" fill="url(#horn)"/>
  <g clip-path="url(#hornClip)" fill="none" stroke="#9A6A1E" stroke-opacity="0.4" stroke-width="4" transform="translate(0 14)">
    <path d="M226 240 Q256 236 290 214"/>
    <path d="M226 190 Q256 186 290 164"/>
    <path d="M226 140 Q256 136 290 114"/>
    <path d="M226 92 Q256 88 290 66"/>
  </g>
</svg>
