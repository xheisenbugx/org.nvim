    <linearGradient id="frame" gradientUnits="userSpaceOnUse" x1="160" y1="700" x2="720" y2="220">
      <stop offset="0" stop-color="#7C4DF0"/>
      <stop offset="0.3" stop-color="#B06AF7"/>
      <stop offset="0.65" stop-color="#6E62F2"/>
      <stop offset="1" stop-color="#4C86F6"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15143A"/>
      <stop offset="1" stop-color="#0B0B20"/>
