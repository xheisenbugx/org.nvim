    <clipPath id="tileClip"><rect x="22" y="45" width="900" height="900" rx="200"/></clipPath>
    <clipPath id="hornClip2"><path d="M625 476 Q627 466 634 472 L674 540 Q656 558 633 554 Z"/></clipPath>
    <path id="star" d="M0 -40 V40 M-34.6 -20 L34.6 20 M-34.6 20 L34.6 -20" fill="none" stroke-width="23" stroke-linecap="round"/>
    <path id="sparkle" d="M0 -1 Q0.13 -0.13 1 0 Q0.13 0.13 0 1 Q-0.13 0.13 -1 0 Q-0.13 -0.13 0 -1 Z"/>
    <path id="doc" d="M540 728 L265 764 Q193 776 189 700 L173 322 Q170 246 245 237 L592 196"/>
