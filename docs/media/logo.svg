    <use href="#sparkle" transform="translate(784 397) scale(36 44)" fill="#C9A6FF"/>
    <use href="#sparkle" transform="translate(834 466) scale(26 32)" fill="#7EC8FF"/>
  </g>
  <use href="#sparkle" transform="translate(784 397) scale(34 42)" fill="#CDB0FF"/>
  <use href="#sparkle" transform="translate(834 466) scale(24 30)" fill="#8CCEFF"/>
  <use href="#sparkle" transform="translate(772 492) scale(16 20)" fill="#8FB8FF"/>

  <!-- unicorn -->
  <ellipse cx="690" cy="798" rx="150" ry="16" fill="#05051A" opacity="0.75" filter="url(#soft)"/>

  <!-- tail -->
