  <path d="M620 650 C598 664 586 688 587 712 C588 738 602 762 622 777 C642 791 680 796 712 792 C740 788 752 768 748 744 C744 716 728 690 708 668 C700 658 690 652 680 652 Z" fill="url(#fur)"/>
  <ellipse cx="692" cy="748" rx="52" ry="46" fill="url(#fur)"/>

