    <path d="M738 742 C752 710 792 696 818 708 C840 718 848 746 834 770" stroke="url(#manePink)" stroke-width="30"/>
    <path d="M742 756 C758 730 796 722 814 738 C828 750 828 772 814 786" stroke="url(#maneViolet)" stroke-width="20"/>
