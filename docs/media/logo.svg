  <g clip-path="url(#maneClip)" fill="none" stroke-linecap="round">
    <path d="M722 580 C766 580 792 616 794 660" stroke="url(#manePink)" stroke-width="30"/>
    <path d="M712 612 C750 610 780 640 792 678" stroke="url(#maneViolet)" stroke-width="16"/>
    <path d="M704 642 C738 640 770 660 792 694" stroke="url(#maneTeal)" stroke-width="30"/>
    <path d="M702 684 C714 704 730 716 746 722" stroke="#3F2FB0" stroke-width="30"/>
  </g>

