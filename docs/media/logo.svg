<svg xmlns="http://www.w3.org/2000/svg" viewBox="22 45 900 900" width="512" height="512" role="img" aria-labelledby="title">
  <title id="title">org.nvim</title>
  <defs>
    <radialGradient id="tile" cx="0.42" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#1F1D5C"/>
      <stop offset="0.6" stop-color="#121137"/>
