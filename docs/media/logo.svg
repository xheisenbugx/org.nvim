  <line x1="378" y1="355" x2="552" y2="337" stroke="url(#green)" stroke-width="46" stroke-linecap="round"/>

  <g transform="rotate(-4 288 492)"><use href="#star" x="288" y="492" stroke="#E07EE6"/></g>
  <line x1="386" y1="478" x2="554" y2="458" stroke="url(#violet)" stroke-width="44" stroke-linecap="round"/>

