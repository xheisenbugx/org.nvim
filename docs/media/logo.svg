  <path d="M600 698 C585 712 573 732 567 750 L599 770 C605 750 613 732 621 716 Z" fill="url(#fur)"/>
  <path d="M626 728 C621 746 621 764 625 780 L664 782 C665 764 662 746 656 730 Z" fill="url(#fur)"/>
  <ellipse cx="579" cy="764" rx="27" ry="21" transform="rotate(-30 579 764)" fill="url(#hoof)"/>
  <ellipse cx="644" cy="786" rx="30" ry="18" transform="rotate(-5 644 786)" fill="url(#hoof)"/>
  <ellipse cx="571" cy="758" rx="9" ry="5" transform="rotate(-30 571 758)" fill="#A58FFA" opacity="0.55"/>
  <ellipse cx="634" cy="780" rx="11" ry="4.5" fill="#A58FFA" opacity="0.55"/>

  <!-- head -->
  <path d="M606 574 C592 580 580 592 574 604 C568 618 572 634 584 642 C596 650 612 656 630 662 C654 670 686 668 708 652 C726 638 730 612 720 592 C712 580 700 574 690 572 Z" fill="url(#fur)"/>
  <path d="M702 598 C710 576 728 556 754 544 C760 566 756 590 744 606 Z" fill="url(#fur)"/>
  <path d="M714 594 C720 580 734 566 748 558 C750 574 746 588 738 598 Z" fill="#DDD5FA"/>

  <!-- forelock -->
  <path d="M650 560 C652 530 676 508 704 508 C728 508 744 526 742 550 C740 566 728 574 712 574 C690 574 668 572 650 560 Z" fill="url(#maneViolet)"/>
  <path d="M598 574 C602 556 622 544 646 544 C664 544 684 552 700 566 C680 574 660 580 640 582 C624 584 612 584 604 588 C598 586 597 580 598 574 Z" fill="url(#maneViolet)"/>
  <path d="M672 522 C686 512 706 510 720 516 C730 520 736 528 738 538" fill="none" stroke="#E6B0F4" stroke-width="7" stroke-linecap="round" opacity="0.85"/>
  <path d="M606 568 C614 556 630 550 648 550" fill="none" stroke="#D2B0FB" stroke-width="5" stroke-linecap="round" opacity="0.8"/>

  <!-- horn -->
  <path d="M625 476 Q627 466 634 472 L674 540 Q656 558 633 554 Z" fill="#FFD27A" opacity="0.55" filter="url(#soft)"/>
  <path d="M625 476 Q627 466 634 472 L674 540 Q656 558 633 554 Z" fill="url(#horn)"/>
  <g clip-path="url(#hornClip2)" fill="none" stroke="#D39A3E" stroke-opacity="0.7" stroke-width="4.5" stroke-linecap="round">
    <path d="M622 532 C640 530 656 524 674 512"/>
    <path d="M622 510 C636 508 648 502 662 490"/>
    <path d="M622 490 C630 489 638 485 648 476"/>
  </g>

  <!-- face -->
  <ellipse cx="656" cy="640" rx="15" ry="9" fill="#F5A3CF" opacity="0.55" filter="url(#blur2)"/>
  <path d="M630 617 Q640 600 656 611 Q659 615 658 623" fill="none" stroke="#2A1E5C" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <ellipse cx="596" cy="624" rx="5" ry="3.2" transform="rotate(-20 596 624)" fill="#BBA9EE"/>
</svg>
