    <line x1="703" y1="300" x2="706" y2="482" stroke="url(#frame)" stroke-width="54" opacity="0.55" filter="url(#glow)"/>
    <use href="#doc" stroke="url(#frame)" stroke-width="52"/>
    <line x1="703" y1="300" x2="706" y2="482" stroke="url(#frame)" stroke-width="52"/>
  </g>
