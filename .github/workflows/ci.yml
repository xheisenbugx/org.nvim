name: CI

on:
  pull_request:
    branches: [dev, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, nvim ${{ matrix.nvim }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # v0.11.0: the oldest Neovim org.nvim supports
        nvim: [v0.11.0, stable, nightly]
        include:
          - os: macos-latest
            nvim: stable
    # nightly breakage shouldn't block a merge
    continue-on-error: ${{ matrix.nvim == 'nightly' }}
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.nvim }}
      - name: Git identity for the specs that commit
        run: |
          git config --global user.name "org.nvim CI"
          git config --global user.email "ci@example.invalid"
      - run: nvim --version
      # the timed specs run once, alone, in the perf job
      - run: make test
        env:
          ORG_TEST_PERF: "0"

  # The time budgets and growth checks (perf_budgets_spec.lua) on a runner
  # of their own: next to the other spec files, a busy neighbour could slow
  # one measurement of a growth check and fail it. Algorithmic regressions
  # show on any OS, so one Linux runner is enough.
  perf:
    name: perf budgets (ubuntu-latest, nvim stable)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      - run: nvim --version
      - run: make test SPEC=tests/spec/perf_budgets_spec.lua
        env:
          ORG_PERF_REPORT: "1"

  # The slowest runner (starting processes and touching files cost more on
  # Windows): the spec files are split over three of them (ORG_TEST_SHARD)
  windows:
    name: test (windows-latest, nvim stable, ${{ matrix.shard }}/3)
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      - name: Git identity for the specs that commit
        shell: bash
        run: |
          git config --global user.name "org.nvim CI"
          git config --global user.email "ci@example.invalid"
      - run: nvim --version
      # make test without make: a throwaway XDG_DATA_HOME; the timed specs
      # run in the perf job
      - name: Run specs
        shell: bash
        run: |
          d=$(mktemp -d)
          ORG_TEST_SHARD=${{ matrix.shard }}/3 ORG_TEST_PERF=0 ORG_TEST_PROGRESS=1 XDG_DATA_HOME=$d nvim --headless -u tests/minimal_init.lua -l tests/run.lua < /dev/null

  lint:
    name: lint (stylua)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # the version the code base is formatted with; bump it together with a
      # `make format` pass, since stylua releases can format differently
      - uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: 2.5.2
          args: --check lua plugin ftplugin syntax tests scripts/site

  typecheck:
    name: typecheck (lua-language-server)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # bump it together with a `make typecheck` pass: new releases can add
      # diagnostics
      LUALS_VERSION: 3.19.1
    steps:
      - uses: actions/checkout@v4
      # the runtime's type annotations (vim.api, vim.uv, ...) come from
      # VIMRUNTIME
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      - name: Install lua-language-server
        run: |
          d="$RUNNER_TEMP/luals"
          mkdir -p "$d"
          curl -fsSL "https://github.com/LuaLS/lua-language-server/releases/download/$LUALS_VERSION/lua-language-server-$LUALS_VERSION-linux-x64.tar.gz" \
            | tar -xz -C "$d"
          echo "$d/bin" >> "$GITHUB_PATH"
      - run: lua-language-server --version
      - run: make typecheck

  helptags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
      - name: doc/tags matches doc/org.txt
        run: |
          nvim --headless -u NONE -c "helptags doc" -c q
          git diff --exit-code doc/tags
