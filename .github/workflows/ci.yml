name: CI

on:
  pull_request:
    branches: [dev, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, nvim ${{ matrix.nvim }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # v0.11.0: the oldest Neovim org.nvim supports
        nvim: [v0.11.0, stable, nightly]
        include:
          - os: macos-latest
            nvim: stable
    # nightly breakage shouldn't block a merge
    continue-on-error: ${{ matrix.nvim == 'nightly' }}
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.nvim }}
      - name: Git identity for the specs that commit
        run: |
          git config --global user.name "org.nvim CI"
          git config --global user.email "ci@example.invalid"
      - run: nvim --version
      - run: make test

  windows:
    name: test (windows-latest, nvim stable)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      - name: Git identity for the specs that commit
        shell: bash
        run: |
          git config --global user.name "org.nvim CI"
          git config --global user.email "ci@example.invalid"
      - run: nvim --version
      # PROBE (temporary): does a REPL in a terminal buffer live when a UI
      # is attached (an inner nvim --embed with nvim_ui_attach)?
      - name: Session probe
        continue-on-error: true
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/inner.lua" <<'LUA'
          return function(shown)
            local acc, code = {}, nil
            local buf = vim.api.nvim_create_buf(true, false)
            if shown then vim.api.nvim_set_current_buf(buf) end
            local job
            vim.api.nvim_buf_call(buf, function()
              job = vim.fn.jobstart({ "python", "-i", "-q" }, {
                term = true,
                env = { PYTHON_BASIC_REPL = "1" },
                on_stdout = function(_, d) acc[#acc + 1] = table.concat(d, "<NL>") end,
                on_exit = function(_, c) code = c end,
              })
            end)
            vim.wait(3000, function() return code ~= nil end)
            if code == nil then
              pcall(vim.fn.chansend, job, "print('BEGIN'); print(6*7); print('END')\r")
              vim.wait(3000, function() return code ~= nil end)
            end
            pcall(vim.fn.jobstop, job)
            return "exit=" .. tostring(code) .. " " .. vim.inspect(table.concat(acc, ""))
          end
          LUA
          cat > "$RUNNER_TEMP/outer.lua" <<'LUA'
          local inner = vim.fn.jobstart({ "nvim", "--embed", "-u", "NONE" }, { rpc = true })
          vim.rpcrequest(inner, "nvim_ui_attach", 100, 30, { ext_linegrid = true })
          local path = vim.env.RUNNER_TEMP .. "/inner.lua"
          for _, shown in ipairs({ false, true }) do
            local r = vim.rpcrequest(inner, "nvim_exec_lua", "return dofile(...)(select(2, ...))", { path, shown })
            print("UI attached, " .. (shown and "shown" or "hidden") .. ": " .. r)
          end
          vim.fn.jobstop(inner)
          LUA
          nvim --headless -u NONE -l "$RUNNER_TEMP/outer.lua"
      # make test without make: a throwaway XDG_DATA_HOME
      - name: Run specs
        shell: bash
        run: |
          d=$(mktemp -d)
          ORG_TEST_PROGRESS=1 XDG_DATA_HOME=$d nvim --headless -u tests/minimal_init.lua -l tests/run.lua < /dev/null

  lint:
    name: lint (stylua)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # the version the code base is formatted with; bump it together with a
      # `make format` pass, since stylua releases can format differently
      - uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: 2.5.2
          args: --check lua plugin ftplugin syntax tests

  helptags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
      - name: doc/tags matches doc/org.txt
        run: |
          nvim --headless -u NONE -c "helptags doc" -c q
          git diff --exit-code doc/tags
