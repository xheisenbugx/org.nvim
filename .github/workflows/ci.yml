name: CI

on:
  pull_request:
    branches: [dev, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, nvim ${{ matrix.nvim }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # v0.11.0: the oldest Neovim org.nvim supports
        nvim: [v0.11.0, stable, nightly]
        include:
          - os: macos-latest
            nvim: stable
    # nightly breakage shouldn't block a merge
    continue-on-error: ${{ matrix.nvim == 'nightly' }}
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.nvim }}
      - name: Git identity for the specs that commit
        run: |
          git config --global user.name "org.nvim CI"
          git config --global user.email "ci@example.invalid"
      - run: nvim --version
      - run: make test

  windows:
    name: test (windows-latest, nvim stable)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      - name: Git identity for the specs that commit
        shell: bash
        run: |
          git config --global user.name "org.nvim CI"
          git config --global user.email "ci@example.invalid"
      - run: nvim --version
      # PROBE (temporary): what a REPL in a ConPTY terminal sends back
      - name: Session probe
        if: always()
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/probe.lua" <<'LUA'
          for _, argv in ipairs({ { "python", "-i", "-q" }, { "bash", "--norc", "-i" } }) do
            local acc = {}
            local buf = vim.api.nvim_create_buf(true, false)
            local job
            vim.api.nvim_buf_call(buf, function()
              job = vim.fn.jobstart(argv, { term = true, env = { PYTHON_BASIC_REPL = "1" }, on_stdout = function(_, d) vim.list_extend(acc, { table.concat(d, "<NL>") }) end })
            end)
            vim.wait(3000)
            vim.fn.chansend(job, (argv[1] == "python" and "print('BEGIN'); print(6*7); print('END')" or "echo BEGIN; echo $((6*7)); echo END") .. "\r")
            vim.wait(3000)
            print(argv[1], vim.inspect(table.concat(acc, "")))
            vim.fn.jobstop(job)
          end
          LUA
          nvim --headless -u NONE -l "$RUNNER_TEMP/probe.lua"
      # make test without make: a throwaway XDG_DATA_HOME
      - name: Run specs
        shell: bash
        run: |
          d=$(mktemp -d)
          XDG_DATA_HOME=$d nvim --headless -u tests/minimal_init.lua -l tests/run.lua

  lint:
    name: lint (stylua)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # the version the code base is formatted with; bump it together with a
      # `make format` pass, since stylua releases can format differently
      - uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: 2.5.2
          args: --check lua plugin ftplugin syntax tests

  helptags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
      - name: doc/tags matches doc/org.txt
        run: |
          nvim --headless -u NONE -c "helptags doc" -c q
          git diff --exit-code doc/tags
