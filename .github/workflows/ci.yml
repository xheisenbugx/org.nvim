name: CI

on:
  pull_request:
    branches: [dev, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, nvim ${{ matrix.nvim }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # v0.11.0: the oldest Neovim org.nvim supports
        nvim: [v0.11.0, stable, nightly]
        include:
          - os: macos-latest
            nvim: stable
    # nightly breakage shouldn't block a merge
    continue-on-error: ${{ matrix.nvim == 'nightly' }}
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.nvim }}
      - name: Git identity for the specs that commit
        run: |
          git config --global user.name "org.nvim CI"
          git config --global user.email "ci@example.invalid"
      - run: nvim --version
      - run: make test

  windows:
    name: test (windows-latest, nvim stable)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      - name: Git identity for the specs that commit
        shell: bash
        run: |
          git config --global user.name "org.nvim CI"
          git config --global user.email "ci@example.invalid"
      - run: nvim --version
      # GnuPG for Windows for org-crypt (Git for Windows' MSYS gpg can't run
      # headless); without it the crypt specs are skipped
      - name: GnuPG
        continue-on-error: true
        timeout-minutes: 5
        shell: pwsh
        run: |
          $exe = "$env:RUNNER_TEMP\gnupg.exe"
          Invoke-WebRequest -Uri https://www.gnupg.org/ftp/gcrypt/binary/gnupg-w32-2.5.24_20260923.exe -OutFile $exe
          Start-Process -FilePath $exe -ArgumentList '/S' -Wait
          foreach ($d in "C:\Program Files\GnuPG\bin", "C:\Program Files (x86)\GnuPG\bin") {
            if (Test-Path "$d\gpg.exe") { Add-Content $env:GITHUB_PATH $d; Write-Output "gpg: $d" }
          }
      # make test without make: a throwaway XDG_DATA_HOME
      - name: Run specs
        shell: bash
        run: |
          d=$(mktemp -d)
          # GnuPG for Windows before Git's /usr/bin gpg
          for g in "/c/Program Files/GnuPG/bin" "/c/Program Files (x86)/GnuPG/bin"; do
            if [ -x "$g/gpg.exe" ]; then PATH="$g:$PATH"; fi
          done
          ORG_TEST_PROGRESS=1 XDG_DATA_HOME=$d nvim --headless -u tests/minimal_init.lua -l tests/run.lua < /dev/null

  lint:
    name: lint (stylua)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # the version the code base is formatted with; bump it together with a
      # `make format` pass, since stylua releases can format differently
      - uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: 2.5.2
          args: --check lua plugin ftplugin syntax tests

  helptags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
      - name: doc/tags matches doc/org.txt
        run: |
          nvim --headless -u NONE -c "helptags doc" -c q
          git diff --exit-code doc/tags
