name: Release

# Development happens on dev. main only takes pull requests from
# release/vX.Y.Z branches; merging one tags vX.Y.Z and publishes the GitHub
# release. Its notes are the vX.Y.Z section of CHANGELOG.md, which the
# release branch regenerates with `make changelog` (scripts/changelog.lua);
# GitHub's generated notes (.github/release.yml) are the fallback when the
# section is empty. The tag goes on the release branch's last commit, not
# the merge commit, so dev reaches it once the release branch is merged
# back: org.nvim's version (:Org version) is the latest vX.Y.Z tag of the
# checkout.
on:
  pull_request:
    branches: [main]
    types: [opened, edited, reopened, synchronize, closed]

jobs:
  release-branch:
    name: release branch
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Head branch is release/vX.Y.Z and the tag is new
        env:
          HEAD_REF: ${{ github.head_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! "$HEAD_REF" =~ ^release/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::main only accepts pull requests from release/vX.Y.Z branches (got '$HEAD_REF'). Target dev instead."
            exit 1
          fi
          tag="${HEAD_REF#release/}"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --silent 2>/dev/null; then
            echo "::error::Tag $tag already exists."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: CHANGELOG.md has a section for the version
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          tag="${HEAD_REF#release/}"
          if ! grep -qF "## [$tag]" CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::No '## [$tag]' section. Run 'make changelog' on $HEAD_REF and commit CHANGELOG.md."
            exit 1
          fi

  # The extension promotion report (scripts/extension_report.lua) in the
  # job summary of every release pull request, so each release looks at
  # promoting experimental extensions (CONTRIBUTING.md, "Promoting an
  # extension"). Informational: it never fails. Line coverage comes from
  # the latest Coverage workflow run, when its artifact is still there.
  extensions-report:
    name: extensions report
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
      issues: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # the history and tags: releases since an extension was added and
          # since its last breaking change
          fetch-depth: 0
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      - name: Coverage from the latest Coverage run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the latest run that tested dev: one started on dev, or a
          # scheduled one (it runs on main, the default branch, but checks
          # out dev); not one dispatched on another branch
          id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow coverage.yml --status completed \
            --limit 50 --json databaseId,headBranch,event \
            --jq '[.[] | select(.headBranch == "dev" or .event == "schedule")][0].databaseId // empty' || true)
          if [[ -n "$id" ]]; then
            gh run download "$id" --repo "$GITHUB_REPOSITORY" --name coverage --dir coverage || true
          fi
      - name: Report
        env:
          GH_TOKEN: ${{ github.token }}
        run: make extensions-report ARGS=--markdown | tee -a "$GITHUB_STEP_SUMMARY"

  publish:
    if: github.event.action == 'closed' && github.event.pull_request.merged && startsWith(github.head_ref, 'release/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write # to start pages.yml
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Tag and publish the release
        env:
          HEAD_REF: ${{ github.head_ref }}
          SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${HEAD_REF#release/}"
          # the version's section of CHANGELOG.md without its heading, up to
          # the next version or the link definitions at the end
          awk -v h="## [$tag]" '
            index($0, h) == 1 { on = 1; next }
            on && (/^## \[/ || /^\[[^]]+\]: /) { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          prev=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)
          if grep -q '[^[:space:]]' notes.md && ! grep -qx 'No changes yet.' notes.md; then
            if [[ -n "$prev" ]]; then
              printf '\n**Full Changelog**: https://github.com/%s/compare/%s...%s\n' \
                "$GITHUB_REPOSITORY" "$prev" "$tag" >> notes.md
            fi
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$SHA" \
              --title "org.nvim $tag" --notes-file notes.md
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$SHA" \
              --title "org.nvim $tag" --generate-notes
          fi
      # The release event of a release made with GITHUB_TOKEN doesn't start
      # workflows, so deploy the documentation site from here. It runs on
      # main (which the github-pages environment allows) and builds the tag.
      - name: Deploy the documentation site
        env:
          HEAD_REF: ${{ github.head_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main -f ref="${HEAD_REF#release/}"
