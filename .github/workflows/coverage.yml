name: Coverage

# Line coverage of lua/org by the specs (make coverage), weekly and on
# demand. It never runs on pull requests; it fails when a path of
# scripts/coverage_floor.txt dropped below its floor (make coverage-check).
# The report (every module, lowest coverage first, and the lines no spec
# runs) is uploaded as the "coverage" artifact; the totals and the 20
# lowest modules go to the run's summary, followed by the extension
# promotion report (make extensions-report). A failure of a run that tests
# dev opens an issue labelled "coverage" (or comments on the open one).
on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # a scheduled run starts from the default branch (main, the last
          # release): test dev, where new code lands
          ref: ${{ github.event_name == 'schedule' && 'dev' || github.ref }}
          # the history and tags, for the extension promotion report
          fetch-depth: 0
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      - name: Git identity for the specs that commit
        run: |
          git config --global user.name "org.nvim CI"
          git config --global user.email "ci@example.invalid"
      # a failing spec still leaves a report; the step fails after it
      - name: Run the specs with coverage
        id: run
        shell: bash
        run: make coverage 2>&1 | tee coverage.log
        continue-on-error: true
      # every path of scripts/coverage_floor.txt at or above its floor
      - name: Coverage floors
        id: floors
        if: always()
        continue-on-error: true
        run: |
          if [ ! -f coverage/coverage.json ]; then
            echo "::error::No coverage/coverage.json to check the floors against."
            exit 1
          fi
          set -o pipefail
          make --no-print-directory coverage-check | tee coverage/floors.txt
      - name: Summary
        if: always()
        run: |
          if [ -f coverage/summary.md ]; then
            cat coverage/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No coverage report was written." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f coverage/floors.txt ]; then
            {
              printf '\n### Coverage floors\n\n```\n'
              cat coverage/floors.txt
              printf '```\n'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      # each criterion of "Promoting an extension" (CONTRIBUTING.md) with
      # this coverage, and the candidates for stable
      - name: Extension promotion report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: make extensions-report ARGS=--markdown >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: |
            coverage/report.md
            coverage/summary.md
            coverage/missed.txt
            coverage/coverage.json
            coverage/floors.txt
          if-no-files-found: warn
      # A failed run on dev (the scheduled one, or one started on dev)
      # says so in an issue: nobody watches a weekly run, and it was red
      # for four weeks (2026-10-26 to 2026-11-16) before anyone noticed.
      # A run started on another branch only fails.
      - name: Report the failure in an issue
        if: >-
          always()
          && (steps.run.outcome == 'failure' || steps.floors.outcome == 'failure')
          && (github.event_name == 'schedule' || github.ref == 'refs/heads/dev')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SPECS: ${{ steps.run.outcome }}
          FLOORS: ${{ steps.floors.outcome }}
        run: |
          sha=$(git rev-parse --short=12 HEAD)
          {
            echo "The [weekly coverage run]($RUN_URL) on \`dev\` at \`$sha\` failed."
            if [ "$SPECS" = failure ]; then
              echo
              echo "Specs failed under \`make coverage\`, which turns the JIT off and counts"
              echo "every line: a time limit that doesn't skip under \`under_coverage()\`"
              echo "fails here before anywhere else."
              echo
              echo '```'
              # the failures, from the first FAIL to the totals (head may
              # cut sed off: with pipefail, that is a failure to ignore)
              sed -n '/^FAIL: /,/^[0-9]* passed, [0-9]* failed/p' coverage.log | head -c 30000 || true
              echo '```'
            fi
            if [ "$FLOORS" = failure ]; then
              echo
              echo "A path of \`scripts/coverage_floor.txt\` is below its floor, or the floors"
              echo "couldn't be checked (CONTRIBUTING.md, \"Coverage floors\"):"
              echo
              echo '```'
              if [ -f coverage/floors.txt ]; then
                head -c 20000 coverage/floors.txt
              else
                echo "No coverage/coverage.json to check the floors against."
              fi
              echo '```'
            fi
          } > issue.md
          gh label create coverage --color FBCA04 --description "Found by the weekly Coverage run" 2>/dev/null || true
          num=$(gh issue list --label coverage --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$num" ]; then
            gh issue comment "$num" --body-file issue.md
          else
            gh issue create --title "Coverage: weekly run failed" --label coverage --body-file issue.md
          fi
      - name: Fail when a spec failed
        if: steps.run.outcome == 'failure'
        run: |
          echo "::error::Specs failed during the coverage run; see the 'Run the specs with coverage' step."
          exit 1
      - name: Fail when a path is below its coverage floor
        if: always() && steps.floors.outcome == 'failure'
        run: |
          echo "::error::Line coverage dropped below a floor of scripts/coverage_floor.txt; see the 'Coverage floors' step."
          exit 1
